services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: ${MONGODB_URI}
    restart: unless-stopped

  mongodb:
    image: mongo:7.0.14
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  mongodb-data:
